# 局域网 ESL 实例的 Cloudflare Tunnel Compose 覆盖配置。
# Tunnel 只建立出站连接，不需要公开入站端口。
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    # 凭据目录以宿主机用户的 0600 权限挂载；Tunnel 容器只读访问该目录。
    user: "0:0"
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:?Set CLOUDFLARED_CONFIG_DIR to the cloudflared credentials directory}:/etc/cloudflared:ro
    depends_on:
      server:
        condition: service_started
