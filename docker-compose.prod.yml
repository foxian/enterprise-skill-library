# 生产环境 override：与 docker-compose.yml 叠加使用
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
#
# 只表达生产与开发的差异（ADR-0047）：
# - Git Backend 直连端口不发布（仅开发/E2E 经宿主 3001 访问）
# - 对外地址、TLS、镜像化前端等差异随后续条目补充

services:
  gitea:
    # 替换而非追加：compose 对多文件 ports 默认取并集，必须显式覆盖为空
    ports: !override []

  api:
    # 生产恒不灌种子数据（干净启动，ADR-0018/0047）——即使 .env 误设为 true
    environment:
      ESL_AUTO_SEED: "false"

  server:
    # 前端产物与 nginx 配置烤入镜像（docker/web.Dockerfile），
    # 替换开发期的 dist/nginx.conf bind-mount
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    volumes: !override []
