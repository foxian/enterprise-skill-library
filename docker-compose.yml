services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    volumes:
      - ${ESL_DATA_DIR:-./data}/gitea:/data
      - ./docker/gitea-custom-hooks:/data/gitea/custom/hooks:ro
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/git/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__CUSTOM_HOOKS_PATH: /data/gitea/custom/hooks
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 与 ESL 共用同一密码最小长度(默认 12),保证双端策略一致
      GITEA__security__MIN_PASSWORD_LENGTH: ${ESL_PASSWORD_MIN_LENGTH:-12}

  gitea-bootstrap:
    image: gitea/gitea:1.22
    depends_on:
      - gitea
    volumes:
      - ${ESL_DATA_DIR:-./data}/gitea:/data
      - ${ESL_DATA_DIR:-./data}/secrets:/bootstrap
      - ./docker/gitea-bootstrap.sh:/bootstrap/gitea-bootstrap.sh:ro
    environment:
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME:-eslroot}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_TOKEN_FILE: ${GITEA_ADMIN_TOKEN_FILE:-/bootstrap/gitea-admin-token}
    entrypoint: ["/bin/sh", "/bootstrap/gitea-bootstrap.sh"]

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Container-internal path: /data is the bind-mount destination
      DATABASE_PATH: /data/esl.db
      ESL_PASSWORD_MIN_LENGTH: ${ESL_PASSWORD_MIN_LENGTH:-12}
      ESL_APPLICATION_ENCRYPTION_KEY: ${ESL_APPLICATION_ENCRYPTION_KEY}
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_TOKEN_FILE: ${GITEA_ADMIN_TOKEN_FILE:-/bootstrap/gitea-admin-token}
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME:-eslroot}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      # Seed sample skill metadata at startup (development only)
      ESL_AUTO_SEED: ${ESL_AUTO_SEED:-false}
      # Deployment mode and default-org declarations (ADR-0022): single mode
      # requires a default org + org admin password; multi mode optionally
      # accepts the pair to provision a default org at bootstrap.
      ESL_DEPLOYMENT_MODE: ${ESL_DEPLOYMENT_MODE:-multi}
      ESL_DEFAULT_ORG: ${ESL_DEFAULT_ORG:-}
      ESL_ORG_ADMIN_PASSWORD: ${ESL_ORG_ADMIN_PASSWORD:-}
    volumes:
      - ${ESL_DATA_DIR:-./data}/api:/data
      - ${ESL_DATA_DIR:-./data}/secrets:/bootstrap:ro
    depends_on:
      gitea-bootstrap:
        condition: service_completed_successfully

  server:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # packages/web 的构建产物（先在宿主机执行 npm run build --workspace @esl/web）
      - ./packages/web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      # 等 api 健康检查通过再启动，消除冷启动 502 窗口
      api:
        condition: service_healthy
      gitea:
        condition: service_started
