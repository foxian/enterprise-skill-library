name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.17', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @esl/core && npm run build --workspace @esl/i18n && npm run build --workspace @esl/cli
      - run: npx vitest run packages/cli packages/core packages/i18n

  server:
    name: Server (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @esl/core && npm run build --workspace @esl/i18n && npm run build --workspace @esl/server
      - run: npx vitest run packages/server
      - run: npm run build --workspace @esl/web && npm test --workspace @esl/web
