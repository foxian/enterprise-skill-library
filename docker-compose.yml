services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    # 暴露宿主 3001:E2E 与调试经 Git Backend admin API 断言成员关系
    # (docker-compose.debug.yml 亦声明同一端口)。仅开发栈使用。
    ports:
      - "3001:3000"
    volumes:
      - ${ESL_DATA_DIR:-./data}/gitea:/data
      - ./docker/gitea-custom-hooks:/data/gitea/custom/hooks:ro
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/git/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__CUSTOM_HOOKS_PATH: /data/gitea/custom/hooks
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 与 ESL 共用同一密码最小长度(默认 8),保证双端策略一致
      GITEA__security__MIN_PASSWORD_LENGTH: ${ESL_PASSWORD_MIN_LENGTH:-8}

  gitea-bootstrap:
    image: gitea/gitea:1.22
    depends_on:
      - gitea
    volumes:
      - ${ESL_DATA_DIR:-./data}/gitea:/data
      - ${ESL_DATA_DIR:-./data}/secrets:/bootstrap
      - ./docker/gitea-bootstrap.sh:/bootstrap/gitea-bootstrap.sh:ro
    environment:
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME:-eslroot}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_TOKEN_FILE: ${GITEA_ADMIN_TOKEN_FILE:-/bootstrap/gitea-admin-token}
      ESL_PASSWORD_MIN_LENGTH: ${ESL_PASSWORD_MIN_LENGTH:-8}
    entrypoint: ["/bin/sh", "/bootstrap/gitea-bootstrap.sh"]

  api:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Container-internal path: /data is the bind-mount destination
      DATABASE_PATH: /data/esl.db
      # 诊断日志级别(ADR-0045):trace|debug|info|warn|error|fatal,非法值启动即失败
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ESL_PASSWORD_MIN_LENGTH: ${ESL_PASSWORD_MIN_LENGTH:-8}
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_TOKEN_FILE: ${GITEA_ADMIN_TOKEN_FILE:-/bootstrap/gitea-admin-token}
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME:-eslroot}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      # Seed sample skill metadata at startup (development only)
      ESL_AUTO_SEED: ${ESL_AUTO_SEED:-false}
    # 日志进 stdout(JSON Lines),由部署层采集。这里只约束单文件大小与文件数,
    # 防止开发环境长时间运行占满磁盘;按日期归档与保留天数由采集器/logrotate 负责。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - ${ESL_DATA_DIR:-./data}/api:/data
      - ${ESL_DATA_DIR:-./data}/secrets:/bootstrap:ro
    depends_on:
      gitea-bootstrap:
        condition: service_completed_successfully

  server:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # packages/web 的构建产物（先在宿主机执行 npm run build --workspace @esl/web）
      - ./packages/web/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      # 等 api 健康检查通过再启动，消除冷启动 502 窗口
      api:
        condition: service_healthy
      gitea:
        condition: service_started
