# 启用 TLS 后由 enable-tls.sh 生成的 compose 片段整体挂载为
# /etc/nginx/nginx.conf（ADR-0047：TLS 是"加一个开关"）。路由集必须与
# nginx.conf 保持一致（tests/nginx-tls-parity.test.mjs 守护该不变量）；
# 证书由 enable-tls.sh 经 certbot 签发后以文件挂载进 /etc/nginx/tls。
events {}

http {
  include /etc/nginx/mime.types;
  client_max_body_size 200m;

  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_vary on;

  # 拒绝未声明 Host 的 HTTPS 直连请求。
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 444;
  }

  # HTTP → HTTPS 跳转（ACME standalone 签发期间 server 容器是停着的，
  # 不存在 80 端口被占用的冲突；续期同样走 standalone）
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  # 官网入口（ADR-0058）。尚无主页前，根路径与管理台临时导向 cloud，
  # 避免 www 继续充当控制台入口。与 nginx.conf 路由集对齐。
  server {
    listen 443 ssl;
    http2 on;
    server_name www.enterprise-skills.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    location = / {
      return 302 https://cloud.enterprise-skills.com/admin/login;
    }

    location /admin {
      return 302 https://cloud.enterprise-skills.com$request_uri;
    }

    # 临时兜底：其他路径也导向 cloud 登录，直到官网落地。
    location / {
      return 302 https://cloud.enterprise-skills.com/admin/login;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name enterprise-skills.com
      cloud.enterprise-skills.com docs.enterprise-skills.com
      status.enterprise-skills.com localhost 127.0.0.1;

    # 与 nginx.conf 对齐：跳转发相对 Location，避免丢端口/协议。
    absolute_redirect off;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # 根域名保持 canonical 到 www（HTTPS 直连场景；Tunnel 场景见 nginx.conf）。
    if ($host = enterprise-skills.com) {
      return 301 https://www.enterprise-skills.com$request_uri;
    }

    location /health {
      proxy_pass http://api:3000/health;
    }

    location /api/ {
      proxy_pass http://api:3000/api/;
      # 禁用代理缓冲:SSE(/api/operations/:id/stream)依赖事件实时推送,
      # 缓冲会导致前端收不到 completed 事件而停在中间状态。
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /git/ {
      proxy_pass http://gitea:3000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cloud/localhost 根路径直达技能库认证入口（与 nginx.conf 对齐）。
    location = / {
      return 302 /admin/login;
    }

    location = /admin {
      return 301 /admin/;
    }

    location /admin/assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin/index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
    }

    location /admin/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /admin/index.html;
    }
  }
}
