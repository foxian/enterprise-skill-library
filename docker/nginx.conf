events {}

http {
  include /etc/nginx/mime.types;
  client_max_body_size 200m;

  # API JSON 传输压缩（install 下载 Published Skill Package 实测降至 1/3 左右）。
  # Content-Encoding 对客户端透明：fetch 自动解压，CLI 的 sha256 校验仍对
  # 明文字节计算，与包文件名中的校验和一致。刻意不包含 text/event-stream：
  # SSE 事件会攒在压缩缓冲里，破坏 /api/operations/:id/stream 的实时推送。
  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_vary on;

  # 默认服务（ADR-0058）：不绑定任何域名，localhost / 服务器 IP / 任意 hostname
  # 都可以直接访问，自托管部署开箱即用。
  #
  # 需要自定义子域名、canonical 跳转或官网与管理台分离等实例特定路由时，
  # 在仓库根目录的 nginx-conf.d/ 中添加 .conf 文件（该目录经
  # docker-compose.prod.yml 挂载到 /etc/nginx/conf.d，且不纳入版本控制）。
  server {
    listen 80 default_server;
    server_name _;

    # 跳转发相对 Location（/admin/login 而非 http://$host/...）：默认
    # absolute_redirect 用不含端口的 $host 拼绝对地址，会把 :3000 丢掉，
    # 浏览器跟随后落到 80 端口。相对地址保留当前 host:port，且对 TLS/域名透明。
    absolute_redirect off;

    location /health {
      proxy_pass http://api:3000/health;
    }

    location /api/ {
      proxy_pass http://api:3000/api/;
      # 禁用代理缓冲:SSE(/api/operations/:id/stream)依赖事件实时推送,
      # 缓冲会导致前端收不到 completed 事件而停在中间状态。
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /git/ {
      proxy_pass http://gitea:3000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 根路径直达技能库认证入口（单入口 ADR-0004）：
    # 访问 / 即跳登录页，无需记住 /admin/ 前缀；注册入口在登录页内。
    location = / {
      return 302 /admin/login;
    }

    # Web 管理后台静态资源（Vue History 模式，回退到 /admin/index.html）。
    # 产物挂载在 /usr/share/nginx/html/admin，用 root（而非 alias）避免 try_files 语义问题。
    location = /admin {
      return 301 /admin/;
    }

    # 带 hash 的构建产物可永久缓存
    location /admin/assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存，保证发版后浏览器立即拿到新版本
    location = /admin/index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
    }

    location /admin/ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /admin/index.html;
    }
  }

  # 实例层自定义路由（ADR-0060）：声明具体 server_name 的 server 块优先于
  # 上方 default_server。该目录由实例维护，不属于公开产品仓库。
  include /etc/nginx/conf.d/*.conf;
}
