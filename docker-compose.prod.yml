# 生产环境 override：与 docker-compose.yml 叠加使用
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml <cmd>
#
# 只表达生产与开发的差异（ADR-0047）：
# - Git Backend 直连端口不发布（仅开发/E2E 经宿主 3001 访问）
# - 对外地址、TLS、镜像化前端等差异随后续条目补充

services:
  gitea:
    # 替换而非追加：compose 对多文件 ports 默认取并集，必须显式覆盖为空
    ports: !override []

  api:
    # 生产恒不灌种子数据（干净启动，ADR-0018/0047）——即使 .env 误设为 true
    environment:
      ESL_AUTO_SEED: "false"

  server:
    # 前端产物烤入镜像（docker/web.Dockerfile），替换开发期的 dist bind-mount。
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_PROXY: ${NPM_PROXY:-}
    # 实例层自定义 nginx 路由（ADR-0060）：nginx-conf.d/ 不纳入版本控制，
    # 挂载到专用目录 instance-conf（避开镜像自带的 conf.d/default.conf）。
    # 目录为空时使用镜像内默认配置（default_server，不绑定域名）。
    volumes: !override
      - ./nginx-conf.d:/etc/nginx/instance-conf:ro
    # 生产服务默认不发布宿主机端口；如何把入口暴露到公网（反向代理、Tunnel、
    # 端口映射等）由部署者自行决定。
    ports: !override []
